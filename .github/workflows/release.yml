name: Release DMG

# Tag-triggered, not push-triggered: the tag is where the version number comes
# from, and shipping a build without one means every release claims to be 1.0.
#   git tag v1.1 && git push origin v1.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual re-run, uses the latest tag reachable

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ -n "$TAG" ] || { echo "No tag to build from"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Without this the runner has no identity and build-app.sh falls back to
      # ad-hoc, which is what makes every update reset the user's Accessibility
      # permission. Skipped cleanly when the secrets aren't set yet, so the
      # workflow still produces a (warned-about) ad-hoc build.
      #
      # SIGNING_CERT_P12 is `base64 -i Tappy.p12` of the exported certificate;
      # SIGNING_CERT_PASSWORD is the password used when exporting it.
      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No SIGNING_CERT_P12 secret — this release will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # No timeout, or the keychain relocks partway through a long build.
          security set-keychain-settings build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f /tmp/cert.p12
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/"/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "Certificate imported but no codesigning identity found"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Signing identity: $IDENTITY"

      - name: Build Tappy.app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: ./build-app.sh

      # $CI is set by GitHub, so make-dmg.sh skips the Finder pass and replays
      # Resources/dmg-DS_Store instead. Re-bake that file locally if the
      # wallpaper or icon positions ever change.
      - name: Package Tappy.dmg
        run: ./make-dmg.sh

      - name: Check the layout survived
        run: |
          hdiutil attach Tappy.dmg -noautoopen -mountpoint /tmp/tappy >/dev/null
          test -f /tmp/tappy/.background/bg.tiff || { echo "wallpaper missing"; exit 1; }
          test -d /tmp/tappy/Tappy.app          || { echo "app missing"; exit 1; }
          grep -q "bg.tiff" /tmp/tappy/.DS_Store || { echo "layout missing"; exit 1; }
          hdiutil detach /tmp/tappy >/dev/null

      # Published to the PUBLIC repo, because release assets on a private repo
      # need an auth token to download and the website button must be a plain
      # link. RELEASE_TOKEN is a fine-grained PAT with contents:write on
      # DeaDoes/tappy-downloads.
      - name: Publish to the public download repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}   # via env, never interpolated into the shell
        run: |
          gh release create "$GITHUB_REF_NAME" Tappy.dmg \
            --repo DeaDoes/tappy-downloads \
            --title "Tappy $VERSION" \
            --notes "macOS 13 or later. Download Tappy.dmg, drag it into Applications."
